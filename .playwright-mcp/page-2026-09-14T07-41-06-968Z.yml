          - generic [ref=e154]: September in Cyprus, the turn into autumn
          - heading "Cook what the island is giving this month" [level=2] [ref=e155]
          - paragraph [ref=e156]: September is the harvest. Grapes come down from the Troodos villages and the presses run, while everything on the coast is still hot enough to taste of July. Aubergines, courgettes and okra are at their cheapest, the last good tomatoes are here, and the first pomegranates and prickly pears turn up on the stalls long before the citrus arrives in December.
          - paragraph [ref=e157]: "Our produce guide runs on the Cypriot calendar, so summer means June to August and winter means oranges, kolokasi and wild greens rather than stone fruit. Buy heavily now and put some away: this is the month for spoon sweets, for drying oregano off the stem, and for roasting and freezing peppers while they cost almost nothing."
          - list [ref=e158]:
            - listitem [ref=e159]: Grapes
            - listitem [ref=e160]: Figs
            - listitem [ref=e161]:
