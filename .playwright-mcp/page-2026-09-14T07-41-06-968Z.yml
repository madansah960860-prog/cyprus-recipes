    - region [ref=e243]:
      - generic [ref=e244]:
        - heading "Who pays for all this" [level=2] [ref=e245]
        - paragraph [ref=e246]: We sell you nothing in order to read a recipe. There is no paywall on any cooking content on Meraki Table and there will not be one. A tested recipe site still costs money to run, so here is where ours comes from, set out plainly.
        - list [ref=e247]:
          - listitem [ref=e248]:
            - generic [ref=e249]:
              - heading "Display advertising" [level=3] [ref=e250]
              - paragraph [ref=e251]: We sell advertising space through partners including Google. Ads sit below the content, carry an advertising label, and never cover a method step, an ingredient list or a button.
          - listitem [ref=e252]:
            - generic [ref=e253]:
              - heading "Affiliate commissions" [level=3] [ref=e254]
              - paragraph [ref=e255]: Some links to pans, thermometers and pantry staples earn us a small commission if you buy. The disclosure sits beside the link itself rather than only in the footer, and you pay exactly the same price either way.
          - listitem [ref=e256]:
            - generic [ref=e257]:
              - heading "Cookbooks and seasonal bundles" [level=3] [ref=e258]
              - paragraph [ref=e259]: We sell downloadable PDF cookbooks and seasonal meal-plan bundles, priced in euro. Buying one is optional, and nothing that was free on the site is ever moved into a paid file.
          - listitem [ref=e260]:
            - generic [ref=e261]:
              - heading "Optional membership" [level=3] [ref=e262]
              - paragraph [ref=e263]: Meraki Table Membership is €5.50 a month for ad-free browsing, printable recipe cards and saved collections.
          - listitem [ref=e264]:
            - generic [ref=e265]:
              - heading "Sponsored recipes and newsletter slots" [level=3] [ref=e266]
              - paragraph [ref=e267]: Now and then a producer pays us to develop a recipe. Those pages carry a sponsorship label at the very top, above the photograph, and the testing standard does not change. Newsletter sponsorship is labelled the same way inside the email.
