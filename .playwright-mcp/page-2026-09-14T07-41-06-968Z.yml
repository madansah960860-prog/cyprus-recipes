            - listitem [ref=e167]:
              - generic [ref=e168]: Prickly pear
          - generic [ref=e169]:
            - heading "At the laiki this week" [level=3] [ref=e170]
            - paragraph [ref=e171]: Go before nine and walk the whole row once before you buy anything. Ask for the small knobbly okra rather than the long smooth ones, they hold their shape in the pot. Village tomatoes sold soft and split are the ones to buy for sauce and usually cost half as much. Take your own bag and small notes, and expect about €1.50 a kilo for courgettes while the season is at its peak.
          - link "See the month by month guide" [ref=e172] [cursor=pointer]:
            - /url: seasonal-produce.html
