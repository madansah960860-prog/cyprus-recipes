        - generic [ref=e177]: What we are for
        - heading "A table worth sitting at for three hours" [level=2] [ref=e178]
        - paragraph [ref=e179]: Cypriot food is not difficult. It is patient. The halloumi goes on dry, the bread goes round the table by hand, and the second plate of everything arrives whether you asked for it or not.
        - generic [ref=e180]:
          - paragraph [ref=e181]: "We write for the kitchen as it actually is in this country: a small hob, a long hot summer, a jar of carob syrup at the back of the cupboard and a tin of good oil somebody in the family sent down from the village. The recipes are precise because precision respects your time and your money, not because cooking should feel like an exam."
          - paragraph [ref=e182]: So there is no method that eats a Sunday for no reason, and no ingredient ordered from abroad when something grown twenty minutes away does the job better. We do not call a dish traditional when we have changed it, and we do not call it ours when a yiayia in Lefkara taught it to us.
          - paragraph [ref=e183]: And there is no paywall. If a recipe is on this site, you can cook it tonight for nothing.
