        - generic [ref=f4e192]:
          - heading "Method" [level=2] [ref=f4e193]
          - list [ref=f4e194]:
            - listitem [ref=f4e195]:
              - generic [ref=f4e196]:
                - heading "Brine the chops" [level=3] [ref=f4e197]
                - paragraph [ref=f4e198]: Stir the salt and sugar into the cold water until dissolved. Sit the chops in the brine for 15 minutes, no longer. Fifteen minutes seasons the meat without making it taste like ham.
            - listitem [ref=f4e199]:
              - generic [ref=f4e200]:
                - heading "Get the fire right" [level=3] [ref=f4e201]
                - paragraph [ref=f4e202]: On charcoal, light it early and wait until the coals are covered in grey ash with no flame, then rake them to one side. On gas, turn the plate to high and give it a full ten minutes with the lid down. Either way you want around 230°C at the bars. Meat put on a grill that has not properly heated is the main reason pork sticks.
            - listitem [ref=f4e203]:
              - generic [ref=f4e204]:
                - heading "Dry, oil and season" [level=3] [ref=f4e205]
                - paragraph [ref=f4e206]: Lift the chops out, discard the brine and pat them very dry. Rub with olive oil and the cracked pepper. Do not add more salt, the brine has done that.
            - listitem [ref=f4e207]:
              - generic [ref=f4e208]:
                - heading "Char the pineapple first" [level=3] [ref=f4e209]
                - paragraph [ref=f4e210]: Lay the pineapple rings on the hot plate and grill for 3 minutes each side, until they carry dark bar marks and smell sweet. Move them to a board and dice once cool enough to handle.
            - listitem [ref=f4e211]:
              - generic [ref=f4e212]:
                - heading "Grill the chops" [level=3] [ref=f4e213]
                - paragraph [ref=f4e214]: Lay the chops down and leave them alone for 4 minutes. Turn once and give them another 4 minutes. Resist moving them around, the crust needs contact time.
            - listitem [ref=f4e215]:
              - generic [ref=f4e216]:
                - heading "Render the fat edge" [level=3] [ref=f4e217]
                - paragraph [ref=f4e218]: Stand the chops on their fat edge, leaning them against each other, for 2 minutes. This renders the fat and is the step most people skip.
            - listitem [ref=f4e219]:
              - generic [ref=f4e220]:
                - heading "Rest" [level=3] [ref=f4e221]
                - paragraph [ref=f4e222]: Move the chops to a warm plate and rest for 5 minutes, loosely covered. The internal temperature will settle at about 63°C. Resting is not optional here.
            - listitem [ref=f4e223]:
              - generic [ref=f4e224]:
                - heading "Build the salsa and serve" [level=3] [ref=f4e225]
                - paragraph [ref=f4e226]: Toss the diced pineapple with the red pepper, onion, chilli, coriander, lime juice, oil and salt flakes. Taste and adjust the lime. Spoon over the rested chops with the plate juices.
          - generic [ref=f4e227]:
            - heading "Cook's tips" [level=3] [ref=f4e228]
            - list [ref=f4e229]:
              - listitem [ref=f4e230]:
                - strong [ref=f4e231]: Do not brine for longer than 20 minutes.
                - text: This is a strong brine at 60 g of salt per litre. Left overnight it will cure the meat and the texture turns bouncy and wet.
              - listitem [ref=f4e232]:
                - strong [ref=f4e233]: Cook the pineapple before the pork, not after.
                - text: Fruit sugars burn onto the plate and the residue will scorch anything that follows. Doing it first also means the salsa can sit and mingle while the pork cooks and rests.
              - listitem [ref=f4e234]:
                - strong [ref=f4e235]: Use the fat edge to test your heat.
                - text: If the fat is not sizzling within ten seconds of touching the bars, the fire is not ready. Take the chops off and wait. Charcoal rewards patience and punishes hurry.
              - listitem [ref=f4e236]:
                - strong [ref=f4e237]: Keep a bare patch of grill.
                - text: Coals flare when fat drips. Somewhere cool to park a chop for thirty seconds is worth more than any technique.
              - listitem [ref=f4e238]:
                - strong [ref=f4e239]: Make it in a pan indoors.
                - text: A heavy cast iron pan over high heat gives almost the same result, minus the smoke that makes it taste like a Sunday. Open a window, and add the pineapple to the same pan afterwards with a knob of butter.
          - heading "Storage" [level=2] [ref=f4e240]
          - paragraph [ref=f4e241]: Cooked pork keeps in an airtight container in the fridge for up to 3 days. Slice it cold for sandwiches rather than reheating, which is the fastest way to make a good chop tough. The salsa keeps for 2 days but loses its crunch, so eat it on day one if you can.
          - heading "Make ahead" [level=2] [ref=f4e242]
          - paragraph [ref=f4e243]: The salsa can be made up to 4 hours ahead without the coriander, which is stirred through at the last minute so it stays green. Pineapple can be charred in the morning and left covered at room temperature. The brine can be mixed the night before and kept in the fridge.
          - heading "Swaps and variations" [level=2] [ref=f4e244]
          - list [ref=f4e245]:
            - listitem [ref=f4e246]:
              - strong [ref=f4e247]: Peaches instead of pineapple
              - text: in July and August, when the local ones are heavy and dripping. Char them cut side down for two minutes, no longer.
            - listitem [ref=f4e248]:
              - strong [ref=f4e249]: Pomegranate and lemon
              - text: in October, when the trees are loaded. Seeds, chopped parsley, olive oil and lemon instead of the lime and pineapple entirely.
            - listitem [ref=f4e250]:
              - strong [ref=f4e251]: Chicken thighs
              - text: take the same brine and about 6 minutes a side.
            - listitem [ref=f4e252]:
              - strong [ref=f4e253]: No chilli
              - text: if you are feeding small children. Add a little finely grated ginger instead for lift without heat.
          - heading "Nutrition" [level=2] [ref=f4e254]
