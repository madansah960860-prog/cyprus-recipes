      - generic [ref=f4e85]:
        - heading "Buy the right chop" [level=2] [ref=f4e86]
        - paragraph [ref=f4e87]: Ask the butcher for loin chops cut 3 cm thick, bone in, about 250 g each. Say kotsi or brizoles and hold your fingers apart to show the thickness; every neighbourhood butcher in Limassol and Nicosia will cut them for you while you wait. The thin chops on foam trays at Alphamega or Lidl Cyprus cook through in about ninety seconds a side, which leaves no time for colour, and they are dry by the time they look appetising. If thick chops are not available, pork neck steaks work the same way and are what most people reach for anyway.
        - paragraph [ref=f4e88]: Pork does not need to be cooked to grey any more. Current EU and Cypriot food safety guidance supports serving whole cuts of pork at 63°C after resting, which leaves the middle faintly pink and considerably juicier. Mince and rolled roasts are different and should still be cooked through.
        - heading "Why this works on charcoal" [level=2] [ref=f4e89]
        - paragraph [ref=f4e90]: "A foukou is built for souvla: a long, low bed of charcoal and a motor turning meat slowly a good distance above it. Chops want the opposite. Rake the coals into one hot half and leave the other half bare, so you have somewhere to move a chop that is colouring too fast. The brine matters more here than on a gas grill, because charcoal heat surges when fat drips and a brined chop shrugs that off. Lump charcoal from the kiosk burns hotter and cleaner than briquettes and is what most Cypriot households use."
        - paragraph [ref=f4e92]:
          - strong [ref=f4e93]: Affiliate disclosure.
          - text: The thermometer link below is an affiliate link, which means we may earn a small commission if you buy through it. It does not change the price, and this recipe works fine with the poke test if you would rather not buy anything.
        - paragraph [ref=f4e94]:
          - text: A cheap instant read probe is the single most useful thing you can add to a charcoal setup.
          - link "Superhome Center" [ref=f4e95] [cursor=pointer]:
            - /url: https://www.superhome.com.cy/
          - text: and most kitchen shops stock one for under €25.
          - generic [ref=f4e96]: Affiliate link. We may earn a commission.
