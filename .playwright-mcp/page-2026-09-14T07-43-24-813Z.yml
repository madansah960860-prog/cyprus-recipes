            - generic [ref=f4e48]: BBQ & outdoor
            - heading "Barbecued Pork Chops with Charred Pineapple Salsa" [level=1] [ref=f4e49]
            - paragraph [ref=f4e50]:
              - text: By
              - link "Elena Christodoulou" [ref=f4e51] [cursor=pointer]:
                - /url: ../about.html
              - text: . Published 12/08/2026. Tested four times, twice over charcoal on a foukou and twice on a gas grill.
            - paragraph [ref=f4e52]: Sunday in a Cypriot yard usually means the foukou is lit, the charcoal is settling to grey, and somebody is arguing about when to put the meat on. This is the quick version, chops rather than a whole souvla, and a fifteen minute brine does the heavy lifting. It seasons the pork right through and buys you a far wider margin before it dries out, which is exactly what you want over charcoal, where the heat is never quite even.
            - list [ref=f4e53]:
              - listitem [ref=f4e54]:
                - generic [ref=f4e55]: Serves 4
              - listitem [ref=f4e56]:
                - generic [ref=f4e57]: Gluten free
              - listitem [ref=f4e58]:
                - generic [ref=f4e59]: Dairy free
            - generic [ref=f4e60]:
              - link "Go to the ingredients" [ref=f4e61] [cursor=pointer]:
                - /url: "#recipe"
              - link "More grill recipes" [ref=f4e62] [cursor=pointer]:
                - /url: ../categories/bbq-and-outdoor.html
          - img "Thick grilled pork chop topped with caramelised pineapple pieces, plated with greens." [ref=f4e64]
