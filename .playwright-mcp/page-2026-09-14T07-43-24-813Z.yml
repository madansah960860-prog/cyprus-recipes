            - text: .
          - heading "Allergens" [level=2] [ref=f4e288]
          - paragraph [ref=f4e289]: No common allergens in the recipe as written. Check the labels on your own oil and any bought condiments served alongside. Speak to a health professional about any dietary or medical need.
      - generic [ref=f4e291]:
        - heading "Questions people ask about this recipe" [level=2] [ref=f4e292]
        - generic [ref=f4e293]:
          - generic [ref=f4e294]:
            - heading [level=3] [ref=f4e295]:
              - button "Can I skip the brine?" [ref=f4e296] [cursor=pointer]:
                - text: Can I skip the brine?
                - generic [aria-hidden] [ref=f4e297]: +
            - paragraph [ref=f4e298]: Yes, and the chops will still be good, but season them generously with salt 40 minutes before cooking instead so the salt has time to travel inwards. Salting five minutes before cooking is the worst option, because the surface is wet at exactly the moment you want it dry.
          - generic [ref=f4e299]:
            - heading [level=3] [ref=f4e300]:
              - button "How do I tell it is done without a thermometer?" [ref=f4e301] [cursor=pointer]:
                - text: How do I tell it is done without a thermometer?
                - generic [aria-hidden] [ref=f4e302]: +
            - paragraph [ref=f4e303]: "Press the middle of the chop with a finger. Raw feels like the flesh at the base of your thumb when your hand is open. Correctly cooked feels like the same spot when you touch your thumb to your middle finger: springy, with a little give. Firm and unyielding means it has gone too far."
          - generic [ref=f4e304]:
            - heading [level=3] [ref=f4e305]:
              - button "Is tinned pineapple acceptable here?" [ref=f4e306] [cursor=pointer]:
                - text: Is tinned pineapple acceptable here?
                - generic [aria-hidden] [ref=f4e307]: +
            - paragraph [ref=f4e308]: It works if you buy rings in juice rather than syrup, drain them well and pat them dry. They will char faster because they are already soft, so give them two minutes a side. Fresh is better, and whole pineapples turn up cheaply enough at Alphamega and the bigger laiki stalls, but this is not a recipe worth abandoning over it.
